<app-m-pagination
  [links]="plantListService.plantListServiceSignal().links"
  (pageChange)="onPageChange($event)">
</app-m-pagination>

<div class="loading" *ngIf="!plantListService.plantListServiceSignal()">
  <p>Loading data...</p>
</div>

<section *ngIf="plantListService.plantListServiceSignal()">
  <h2 class="section-title">Plants</h2>
  <div class="cardContainer">
    <article class="plantCard" *ngFor="let plant of filteredPlantList; index as i;">
      <div class="imgWrap">
        <img class="cardImg" [ngSrc]="plant.image_url || 'assets/img/Untitled_Tree.jpg'" alt="{{plant.common_name || 'plant'}} picture" width="200" height="200">
      </div>
      <div class="cardBody">
        <h3 class="plantName">{{plant.common_name || plant.scientific_name || 'Unnamed plant'}}</h3>
        <p class="sciName" *ngIf="plant.common_name && plant.scientific_name">{{plant.scientific_name}}</p>
      </div>
    </article>
  </div>
</section>
